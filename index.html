<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <h1> Student Performance Dashboard</h1>
</div>

<div class="container">

    <div class="card">
        <h2> Predict Marks</h2>
        <form action="/predict" method="post">
            <input type="number" step="0.1" name="hours" placeholder="Enter Study Hours" required>
            <button type="submit">Predict</button>
        </form>
    </div>

    <div class="card">
        <h2> Check Student</h2>
        <form action="/student" method="post">
            <input type="number" name="roll" placeholder="Enter Roll Number" required>
            <button type="submit">Check</button>
        </form>
    </div>

</div>

<div class="center-btn">
    <a href="/graph"><button class="graph-btn"> View Analytics</button></a>
</div>

</body>
</html>
